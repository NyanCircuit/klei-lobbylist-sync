name: Sync Klei Lobby List

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: klei-lobby-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Run sync
        run: python sync_lobby.py

      - name: Commit and push
        run: |
          git config user.name "Codex"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync lobby $(date -u +'%Y-%m-%dT%H:%M:%SZ')" -m "Co-Authored-By: Codex <chatgpt-codex-connector[bot]@users.noreply.github.com>"
            git push
          fi